<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Governança de Tecnologia SETEC — Visão Executiva</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231F4E8C'/%3E%3Ctext x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='Arial' font-weight='700'%3ES%3C/text%3E%3C/svg%3E">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="marca">
        <div class="marca-logo">S</div>
        <div>
          <div class="marca-titulo">Governança SETEC</div>
          <div class="marca-sub">SOF · Tecnologia</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-rodape" id="rodape-fonte"></div>
    </aside>
    <div class="principal">
      <header class="topo">
        <button class="btn-icone so-mobile" id="btn-menu" aria-label="Abrir menu">☰</button>
        <div class="topo-contexto">
          <span class="rotulo-ciclo">Ciclo</span>
          <strong>2º semestre/2026</strong>
          <span class="sep">·</span>
          <span id="ref-data"></span>
        </div>
        <div class="topo-acoes">
          <label class="seletor-unidade" title="Filtra todas as visões pela participação da unidade">
            <span>Unidade</span>
            <select id="filtro-unidade-global"></select>
          </label>
          <form class="busca" id="form-busca" role="search">
            <input type="search" id="campo-busca" placeholder="Buscar código, iniciativa, compromisso…" aria-label="Buscar">
          </form>
          <button class="btn" id="btn-imprimir" title="Imprimir / salvar em PDF">Imprimir</button>
        </div>
      </header>
      <main class="conteudo" id="conteudo" tabindex="-1"></main>
    </div>
  </div>
  <div class="drawer-fundo" id="drawer-fundo" hidden></div>
  <aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true">
    <button class="drawer-fechar" id="drawer-fechar" aria-label="Fechar">✕</button>
    <div id="drawer-conteudo"></div>
  </aside>
  <script src="assets/dados.js"></script>
  <script src="assets/core.js"></script>
  <script src="assets/v-executiva.js"></script>
  <script src="assets/v-listas.js"></script>
  <script src="assets/v-outras.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
